  if (k === 'views') { setView(v); render(); return; }
  if (k.startsWith('f-')) { const f = k.slice(2); S.set.filters[f] = v; S.lastFilter = S.lastFilter.filter(x => x !== f).concat(f); S.page = 1; S.resetList = true; render(); return; }
  if (k === 'group') { S.set.group = v; S.collapsed = {}; S.page = 1; S.resetList = true; render(); return; }
  if (k === 'sort') { S.set.sort = v; S.page = 1; S.resetList = true; render(); return; }
  if (k === 'perpage') { S.perPage = +v; S.page = 1; S.resetList = true; render(); return; }
  if (k.startsWith('d-')) {
    const d = DEALS[S.open.id]; const key = k.slice(2); const before = d[key];
    applyDealChange(d, key, v);
    const nl = listForPanel(S.open.ctxName); if (nl.list.indexOf(d.id) >= 0) S.open.ctx = nl;
    render();
    toast(`${({ stage: 'Stage', fc: 'Forecast', close: 'Close date' })[key]} changed to ${key === 'close' ? v + ' 2026' : v}. Saved to Salesforce.`, () => { applyDealChange(d, key, before); if (key === 'close') detail(d).closeNote = DETAIL[d.id] && DETAIL[d.id].closeNote || null; });
    render(); return;
  }
  if (k.startsWith('bulk-')) {
    const key = k.slice(5); const ids = [...S.sel]; const before = ids.map(id => DEALS[id][key]);
    ids.forEach(id => applyDealChange(DEALS[id], key, v));
    S.sel.clear();
    toast(`${ids.length} deal${ids.length > 1 ? 's' : ''} updated: ${({ stage: 'stage', fc: 'forecast', close: 'close date' })[key]} set to ${v}.`, () => ids.forEach((id, i) => applyDealChange(DEALS[id], key, before[i])));
    render(); return;
  }
  render();
}

function ctxRemoveFilter(f) {
  delete S.set.filters[f]; S.lastFilter = S.lastFilter.filter(x => x !== f); S.page = 1; S.resetList = true;
}

/* ---------------------------------------------------------------- click handling */
appEl.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  const a = e.target.closest('a'); if (a) e.preventDefault();
  if (!t) {
    if (e.target.closest('button,a,input,[role="button"]')) flashHot();
    return;
  }
  if (t.disabled) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  switch (act) {
    case 'noop': flashHot(); return;
    case 'open': {
      e.preventDefault();
      const ctx = t.dataset.ctx || (S.screen === 'forecast' ? 'right' : 'list');
      if (S.screen === 'stale') { openDeal(id, 'stale'); render(); return; }
      if (t.closest('#foryou')) { S.foryou = false; openDeal(id, 'fy'); render(); scrollRowIntoView(id); return; }
      if (S.screen === 'forecast' && ctx === 'worth') { openDeal(id, 'worth'); render(); return; }
      openDeal(id, ctx); render(); scrollRowIntoView(id); return;
    }
    case 'prev': step(-1); return;
    case 'next': step(1); return;
    case 'close': closePanel(); return;
    case 'view': case 'goto-view': {
      if (S.screen !== 'pipeline') { setPersona('priya'); }
      S.open = null; setView(t.dataset.view); if (act === 'view') S.guide.kpi = 1; render(); return;
    }
    case 'goto-pipeline': if (S.persona !== 'priya' || S.screen !== 'pipeline') setPersona('priya'); S.open = null; setView('open'); render(); return;
    case 'goto-forecast': S.open = null; S.rep = null; S.seg = null; render(); return;
    case 'persona': setPersona(t.dataset.p); render(); toast(t.dataset.p === 'daniel' ? 'Showing Daniel’s Team Forecast, the manager view.' : 'Showing Priya’s pipeline, the rep view.'); render(); return;
    case 'menu': openMenu(t.dataset.menu, t); return;
    case 'menu-close': S.menu = null; render(); return;
    case 'pick': onPick(t.dataset.v); return;
    case 'add-filter': { const f = t.dataset.v; const anchorSel = '[data-act="menu"][data-menu="add-filter"]'; S.menu = null; render(); const anc = document.querySelector(anchorSel); openMenu('f-' + f, anc); return; }
    case 'f-clear': S.menu = null; ctxRemoveFilter(t.dataset.f); render(); return;
    case 'f-clear-all': S.set.filters = {}; S.lastFilter = []; S.page = 1; render(); return;
    case 'q-clear': S.q = ''; render(); return;
    case 'new-toggle': S.set.newOnly = !S.set.newOnly; S.page = 1; S.resetList = true; render(); return;
    case 'reset': setView(S.view); render(); return;
    case 'gtoggle': { const g = t.dataset.g; S.collapsed[g] = !S.collapsed[g]; render(); return; }
    case 'page': S.page = +t.dataset.p; S.resetList = true; render(); return;
    case 'sel': case 'sel-page': case 'sel-group': {
      e.preventDefault();
      if (act === 'sel') { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); }
      else {
        const all = sorted(currentList());
        const ids = act === 'sel-page' ? pageSlice(all).rows.map(d => d.id) : all.filter(d => GROUPS[S.set.group].key(d) === t.dataset.g).map(d => d.id);
        const allOn = ids.every(x => S.sel.has(x));
        ids.forEach(x => allOn ? S.sel.delete(x) : S.sel.add(x));
      }
      render(); return;
    }
    case 'sel-clear': S.sel.clear(); render(); return;
    case 'foryou': S.foryou = !S.foryou; S.menu = null; render(); return;
    case 'foryou-close': S.foryou = false; render(); return;
    case 'fy-read': S.fyRead = true; render(); return;
    case 'fy-show': S.foryou = false; if (S.view !== 'open') setView('open'); S.set.newOnly = true; S.page = 1; render(); return;
    case 'fy-reply': flashHot(); return;
    case 'nw-accept': case 'sg-accept': {
      const d = DEALS.northwind; const x = detail(d);
      x.suggest.state = 'accepted'; S.nw = 'accepted'; d.close = '30 Sep'; x.closeNote = 'Moved today, from 28 Sep';
      render(); if (act === 'nw-accept') toast('Northwind’s close date moved to 30 Sep. Still inside Q3.'); render(); return;
    }
    case 'nw-dismiss': case 'sg-dismiss': { const x = detail(DEALS.northwind); x.suggest.state = 'dismissed'; S.nw = 'dismissed'; render(); return; }
    case 'sg-undo': { const d = DEALS.northwind; const x = detail(d); x.suggest.state = 'open'; S.nw = null; d.close = '28 Sep'; x.closeNote = null; render(); return; }
    case 'edit-amt': S.edit = { kind: 'amt' }; S.focusNext = 'amt-input'; render(); return;
    case 'hs-toggle': { const x = detail(DEALS[S.open.id]); x.hsOpen = !x.hsOpen; render(); return; }
    case 'ns-done': { const x = detail(DEALS[S.open.id]); x.next.done = true; render(); return; }
    case 'ns-undo': { const x = detail(DEALS[S.open.id]); x.next.done = false; render(); return; }
    case 'ns-edit': S.edit = { kind: 'ns' }; S.focusNext = 'ns-text'; render(); return;
    case 'ns-cancel': S.edit = null; render(); return;
    case 'ns-save': saveNext(); return;
    case 'ai-yes': case 'ai-no': case 'ai-cancel': case 'ai-unconfirm': {
      const x = detail(DEALS[S.open.id]); const it = x.call.items[+t.dataset.i];
      it.state = act === 'ai-yes' ? 'confirmed' : act === 'ai-no' ? 'editing' : 'ai';
      if (act === 'ai-no') S.focusNext = 'fix-text';
      render(); return;
    }
    case 'ai-save': saveCorrection(+t.dataset.i); return;
    case 'ai-undo': {
      const d = DEALS[S.open.id]; const x = detail(d); const it = x.call.items[+t.dataset.i];
      const drv = x.drivers.find(v => v.n === it.fx[0]); if (drv) drv.p -= it.fx[1];
      const before = d.health; recompute(d); it.state = 'ai'; it.draft = it.noteRaw || ''; S.flashDriver = it.fx[0];
      render(); toast(`Correction undone. Health ${before} → ${d.health}.`); render(); return;
    }
    case 'act-filter': detail(DEALS[S.open.id]).actFilter = t.dataset.v; render(); return;
    case 'play': toast(`Opens the call recording at ${t.dataset.ts}.`); render(); return;
    case 'rep': {
      const r = t.dataset.rep;
      S.rep = S.rep === r ? null : r; S.seg = null; S.open = null; S.anim.right = true; S.guide.rep = S.guide.rep || (S.rep ? 1 : 0);
      render(); return;
    }
    case 'rep-clear': S.rep = null; S.seg = null; S.open = null; S.anim.right = true; render(); return;
    case 'seg': {
      const sg = t.dataset.seg; S.open = null; S.rep = null; S.anim.right = true;
      if (sg === 'short') { S.seg = null; render(); toast('Worth a conversation lists the deals behind the gap.'); render(); return; }
      if (sg === 'closed') { flashHot(); return; }
      S.seg = S.seg === sg ? null : sg; render(); return;
    }
    case 'rgtoggle': { const l = rightList(); const gi = +t.dataset.gi; const key = (S.rep || S.seg || 'w') + ':' + gi; S.repGroups[key] = !isGroupOpen(gi, l); render(); return; }
    case 'retry': {
      if (S.retrying) return; S.retrying = true; render();
      setTimeout(() => { S.retrying = false; S.screen = 'pipeline'; S.open = null; render(); toast('Synced with Salesforce just now. 4 deals changed since 9:00 AM.'); render(); }, 1400);
      return;
    }
    case 'save-open': {
      const anchor = document.getElementById('save-btn') || t;
      const p = relPos(anchor);
      const applied = Object.keys(S.set.filters).filter(k => S.set.filters[k] != null).map(k => fLabel(k, S.set.filters[k]));
      S.save = { name: applied.length ? applied.join(', ') : (S.set.newOnly ? 'Updated today' : 'My view'), share: 'team', pin: true, def: false, pos: { top: Math.min(p.bottom + 8, 560), right: Math.max(12, p.right) } };
      S.menu = null; S.focusNext = 'view-name'; render(); return;
    }
    case 'save-close': S.save = null; render(); return;
    case 'sv-share': S.save.share = t.dataset.v; syncSaveName(); render(); return;
    case 'sv-toggle': e.preventDefault(); S.save[t.dataset.v] = !S.save[t.dataset.v]; syncSaveName(); render(); return;
    case 'save-do': doSave(); return;
    case 'shortcuts': S.shortcuts = true; render(); return;
    case 'shortcuts-close': S.shortcuts = false; render(); return;
    case 'toast-undo': { const u = S.toast && S.toast.undo; S.toast = null; if (u) u(); render(); return; }
    default: return;
  }
});
function syncSaveName() { const el = document.getElementById('view-name'); if (el && S.save) S.save.name = el.value; }
function doSave() {
  syncSaveName();
  const name = (S.save.name || '').trim() || 'My view';
  const baseView = VIEWS[S.view] ? S.view : (viewDef(S.view).baseView || 'open');
  const v = { id: 'v' + Date.now(), name, baseView, set: JSON.parse(JSON.stringify(S.set)), share: S.save.share, pin: S.save.pin };
  v.base = VIEWS[baseView].base;
  S.saved.push(v); S.view = v.id; S.save = null;
  render();
  toast(`Saved “${esc(name)}”. ${v.share === 'team' ? 'Daniel and your team can open it.' : 'Only you can see it.'}`);
  render();
}
function saveNext() {
  const x = detail(DEALS[S.open.id]); const el = document.getElementById('ns-text'); const text = (el && el.value.trim()) || '';
  if (!text) { S.edit = null; render(); return; }
  x.next = { text, due: x.next && !x.next.done ? x.next.due : 'Due Fri 26 Sep', agreed: 'Added by you just now', overdue: null, done: false };
  S.edit = null; render();
}
function saveCorrection(i) {
  const d = DEALS[S.open.id]; const x = detail(d); const it = x.call.items[i];
  const el = document.getElementById('fix-text'); const raw = (el && el.value.trim()) || '';
  const from = d.health;
  const drv = x.drivers.find(v => v.n === it.fx[0]); if (drv) drv.p += it.fx[1];
  recompute(d);
  it.state = 'corrected'; it.when = 'just now'; it.from = from; it.to = d.health; it.fresh = true;
  it.noteRaw = raw; it.note = esc(raw || it.note.replace(/<[^>]+>/g, ''));
  S.flashDriver = it.fx[0];
  render(); it.fresh = false;
}

/* inputs */
appEl.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; S.page = 1; S.resetList = true; render(); }
  if (e.target.id === 'fix-text') { const x = detail(DEALS[S.open.id]); const it = x.call.items.find(v => v.state === 'editing'); if (it) it.draft = e.target.value; }
  if (e.target.id === 'view-name' && S.save) S.save.name = e.target.value;
});
appEl.addEventListener('focusout', e => {
  if (e.target.id === 'amt-input' && S.edit && S.edit.kind === 'amt') commitAmount(e.target.value);
});
function commitAmount(v) {
  const d = DEALS[S.open.id]; const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10);
  S.edit = null;
  if (n && n !== d.amt) { const before = d.amt; d.amt = n; render(); toast(`Amount changed to ${money(n)}. Saved to Salesforce.`, () => { d.amt = before; }); }
  render();
}

/* ---------------------------------------------------------------- keyboard */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  if (e.key === 'Escape') {
    if (typing && e.target.id === 'amt-input') { S.edit = null; render(); return; }
    if (typing && e.target.id === 'fix-text') { const x = detail(DEALS[S.open.id]); x.call.items.forEach(v => { if (v.state === 'editing') v.state = 'ai'; }); render(); return; }
    if (typing && e.target.id === 'ns-text') { S.edit = null; render(); return; }
    if (typing && e.target.id === 'q') { if (S.q) { S.q = ''; render(); } else e.target.blur(); return; }
    if (S.shortcuts) { S.shortcuts = false; render(); return; }
    if (S.menu) { S.menu = null; render(); return; }
    if (S.save) { S.save = null; render(); return; }
    if (S.foryou) { S.foryou = false; render(); return; }
    if (S.open) { closePanel(); return; }
    if (S.sel.size) { S.sel.clear(); render(); return; }
    if (S.rep || S.seg) { S.rep = null; S.seg = null; render(); return; }
    return;
  }
  if (typing) {
    if (e.key === 'Enter' && e.target.id === 'amt-input') { e.preventDefault(); commitAmount(e.target.value); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'fix-text') { e.preventDefault(); const x = detail(DEALS[S.open.id]); saveCorrection(x.call.items.findIndex(v => v.state === 'editing')); }
    if (e.key === 'Enter' && e.target.id === 'view-name') { e.preventDefault(); doSave(); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'ns-text') { e.preventDefault(); saveNext(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) {
    if ((e.key === 'k' || e.key === 'K') && S.screen === 'pipeline') { e.preventDefault(); const q = document.getElementById('q'); if (q) q.focus(); }
    return;
  }
  if (S.menu) { menuKeys(e); return; }
  if (S.screen === 'pipeline' || (S.screen === 'forecast' && S.open)) {
    const down = e.key === 'ArrowDown' || e.key === 'j', up = e.key === 'ArrowUp' || e.key === 'k';
    if (S.open && (down || up)) { e.preventDefault(); step(down ? 1 : -1); return; }
    if (S.open && (e.key === 'e' || e.key === 'E')) { e.preventDefault(); const b = document.querySelector('#panel [data-menu="d-stage"]'); if (b) openMenu('d-stage', b); return; }
    if (S.screen !== 'pipeline') return;
    const rows = [...document.querySelectorAll('#tbody .drow')].map(r => r.dataset.id);
    if (down || up) {
      e.preventDefault(); if (!rows.length) return;
      let i = rows.indexOf(S.kf); i = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + (down ? 1 : -1)));
      S.kf = rows[i]; render(); scrollRowIntoView(S.kf); return;
    }
    if (e.key === 'Enter' && S.kf) { e.preventDefault(); openDeal(S.kf, 'list'); render(); return; }
    if ((e.key === 'x' || e.key === 'X') && S.kf) { S.sel.has(S.kf) ? S.sel.delete(S.kf) : S.sel.add(S.kf); render(); return; }
    if (e.key === 'g' || e.key === 'G') { const b = document.querySelector('[data-menu="group"]'); if (b) openMenu('group', b); return; }
    if (e.key === '/') { e.preventDefault(); const q = document.getElementById('q'); if (q) q.focus(); return; }
    if (e.key === 'Backspace' && S.lastFilter.length) { ctxRemoveFilter(S.lastFilter[S.lastFilter.length - 1]); render(); return; }
    if (e.key === '?') { S.shortcuts = true; render(); return; }
  }
});
function menuKeys(e) {
  const items = [...document.querySelectorAll('#pmenu .mi')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
}

/* ---------------------------------------------------------------- tooltips: exact numbers and cut-off names */
appEl.addEventListener('mouseover', e => {
  const tip = document.getElementById('tip'); if (!tip) return;
  let el = e.target.closest('[data-tip]');
  let a, b;
  if (el) { [a, b] = el.dataset.tip.split('|'); }
  else {
    el = e.target.closest('.ell');
    if (!el || el.scrollWidth <= el.clientWidth + 1) { tip.hidden = true; return; }
    a = el.textContent; b = null;
  }
  tip.className = 'tip' + (b ? '' : ' one');
  tip.innerHTML = `<span class="a${b ? ' m' : ''}">${esc(a)}</span>${b ? `<span class="b">${esc(b)}</span>` : ''}<i style="left:16px"></i>`;
  tip.hidden = false;
  const p = relPos(el);
  const tr = tip.getBoundingClientRect(); const th = tr.height / scale; const tw = tr.width / scale;
  let top = p.top - th - 8, below = false;
  if (top < 8) { top = p.top + p.height + 8; below = true; }
  let left = Math.min(p.left, 1440 - tw - 12);
  tip.style.top = top + 'px'; tip.style.left = left + 'px';
  tip.classList.toggle('below', below);
  tip.querySelector('i').style.left = Math.max(10, Math.min(tw - 18, p.left - left + 16)) + 'px';
});
appEl.addEventListener('mouseleave', () => { const tip = document.getElementById('tip'); if (tip) tip.hidden = true; });

/* ---------------------------------------------------------------- chrome controls */
document.getElementById('p-priya').addEventListener('click', () => { setPersona('priya'); render(); });
document.getElementById('p-daniel').addEventListener('click', () => { setPersona('daniel'); render(); });
document.getElementById('hot-btn').addEventListener('click', () => { S.hot = !S.hot; render(); });
document.getElementById('zoom-btn').addEventListener('click', () => { S.zoom = S.zoom === 'fit' ? 'actual' : 'fit'; fit(); renderChrome(); });
document.getElementById('restart-btn').addEventListener('click', () => {
  const keep = { hot: S.hot, zoom: S.zoom };
  Object.keys(DETAILS).forEach(k => delete DETAILS[k]);
  Object.values(DEALS).forEach(d => Object.assign(d, ORIG[d.id]));
  fresh(); Object.assign(S, keep); render(); fit();
});
const stateBtn = document.getElementById('state-btn');
stateBtn.addEventListener('click', e => {
  e.stopPropagation();
  const old = document.querySelector('.cmenu'); if (old) { old.remove(); stateBtn.setAttribute('aria-expanded', 'false'); return; }
  const r = stateBtn.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'cmenu'; m.setAttribute('role', 'menu');
  const cur = S.screen === 'pipeline' ? (Object.keys(S.set.filters).length === 2 && S.set.filters.stage === 'Negotiation' && S.set.filters.flag === 'stalled' ? 'filtered' : 'live') : S.screen;
  const opts = [['live', 'Live data', 'Synced 4 min ago'], ['loading', 'Loading', 'CRM sync in progress, then the data arrives'], ['stale', 'Stale sync', 'Last sync failed 6 hours ago'], ['filtered', 'Filtered to nothing', 'Two filters that do not overlap'], ['empty', 'New rep, no deals', 'Maya joined this week']];
  m.innerHTML = opts.map(([k, l, s]) => `<button type="button" role="menuitemradio" aria-checked="${cur === k}" data-k="${k}"><span><span>${l}</span><small>${s}</small></span>${cur === k ? '<span class="ck">✓</span>' : ''}</button>`).join('');
  m.style.top = r.bottom + 6 + 'px'; m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 300)) + 'px';
  document.body.appendChild(m); stateBtn.setAttribute('aria-expanded', 'true');
  m.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    m.remove(); stateBtn.setAttribute('aria-expanded', 'false');
    setState(b.dataset.k);
  });
  const first = m.querySelector('button'); if (first) first.focus();
});
document.addEventListener('click', e => { const m = document.querySelector('.cmenu'); if (m && !m.contains(e.target) && e.target !== stateBtn) { m.remove(); stateBtn.setAttribute('aria-expanded', 'false'); } });
function setState(k) {
  setPersona('priya');
  clearTimeout(setState.t);
  if (k === 'live') { S.screen = 'pipeline'; setView('open'); }
  else if (k === 'loading') { S.screen = 'loading'; setState.t = setTimeout(() => { if (S.screen === 'loading') { S.screen = 'pipeline'; setView('open'); render(); } }, 2200); }
  else if (k === 'stale') { S.screen = 'stale'; }
  else if (k === 'empty') { S.screen = 'empty'; }
  else if (k === 'filtered') { S.screen = 'pipeline'; setView('open'); S.set.filters = { stage: 'Negotiation', flag: 'stalled' }; S.lastFilter = ['stage', 'flag']; }
  render();
}

/* =====================================================================
   boot
===================================================================== */
render(); fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); });
window.__proto = { S, setState, openDeal, render };
})();
</script>
