<style>/* ---------- prototype chrome (outside the product frame) ---------- */
:root{
  --ch-ground:#E7E7EB; --ch-bar:#FFFFFF; --ch-line:#E4E4E7; --ch-t1:#18181B; --ch-t2:#52525B; --ch-t3:#71717A;
  --ch-acc:#5B4FE0; --ch-accT:#4B40CF; --ch-accS:#F3F2FE; --ch-accB:#D9D6FA; --ch-seg:#F4F4F5; --ch-segOn:#FFFFFF;
  --ch-shadow:0 1px 2px rgba(24,24,27,.06),0 24px 64px -24px rgba(24,24,27,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ch-ground:#0E0E10; --ch-bar:#161618; --ch-line:#2A2A2E; --ch-t1:#F4F4F5; --ch-t2:#C8C8CE; --ch-t3:#9A9AA3;
    --ch-acc:#8F86FF; --ch-accT:#B3ADFF; --ch-accS:#221F3D; --ch-accB:#3A3566; --ch-seg:#222226; --ch-segOn:#34343A;
    --ch-shadow:0 1px 2px rgba(0,0,0,.4),0 24px 64px -24px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ch-ground:#0E0E10; --ch-bar:#161618; --ch-line:#2A2A2E; --ch-t1:#F4F4F5; --ch-t2:#C8C8CE; --ch-t3:#9A9AA3;
  --ch-acc:#8F86FF; --ch-accT:#B3ADFF; --ch-accS:#221F3D; --ch-accB:#3A3566; --ch-seg:#222226; --ch-segOn:#34343A;
  --ch-shadow:0 1px 2px rgba(0,0,0,.4),0 24px 64px -24px rgba(0,0,0,.7);
}
html,body{height:100%}
body{margin:0;background:var(--ch-ground);color:var(--ch-t1);font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.shell{height:100%;display:flex;flex-direction:column}
.bar{flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--ch-bar);border-bottom:1px solid var(--ch-line);font-size:13px;line-height:20px}
.bar .brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.bar .brand .mk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:#18181B;color:#fff;font-size:12px;font-weight:500;flex-shrink:0}
:root[data-theme="dark"] .bar .brand .mk{background:#F4F4F5;color:#18181B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .brand .mk{background:#F4F4F5;color:#18181B}}
.bar .brand b{font-weight:600;white-space:nowrap}
.bar .brand span{color:var(--ch-t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segctl{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--ch-seg)}
.segctl button{height:28px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ch-t2);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.segctl button[aria-pressed="true"]{background:var(--ch-segOn);border-color:var(--ch-line);color:var(--ch-t1);font-weight:500;box-shadow:0 1px 2px rgba(24,24,27,.06)}
.cbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--ch-line);border-radius:8px;background:var(--ch-bar);color:var(--ch-t1);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.cbtn:hover{border-color:var(--ch-t3)}
.cbtn .lbl{color:var(--ch-t3);font-weight:400}
.cbtn[aria-pressed="true"]{background:var(--ch-accS);border-color:var(--ch-accB);color:var(--ch-accT)}
.cbtn svg{flex-shrink:0}
.bar button:focus-visible,.cmenu button:focus-visible{outline:2px solid var(--ch-acc);outline-offset:2px}
.guide{display:flex;align-items:center;gap:6px;margin:0;padding:0;list-style:none;color:var(--ch-t3);font-size:12px;line-height:16px}
.guide li{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.guide li .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--ch-line);font-size:11px;font-variant-numeric:tabular-nums;flex-shrink:0}
.guide li.now{color:var(--ch-t1);font-weight:500}
.guide li.now .n{border-color:var(--ch-acc);color:var(--ch-accT);background:var(--ch-accS)}
.guide li.done{color:var(--ch-t2)}
.guide li.done .n{background:var(--ch-acc);border-color:var(--ch-acc);color:#fff}
.guide .sep{width:12px;height:1px;background:var(--ch-line)}
.guide-wrap{display:flex;align-items:center;gap:10px}
.guide-wrap .glabel{font-size:12px;color:var(--ch-t3);white-space:nowrap}
.cmenu{position:fixed;z-index:1000;min-width:240px;padding:6px;border:1px solid var(--ch-line);border-radius:10px;background:var(--ch-bar);box-shadow:0 8px 24px -4px rgba(24,24,27,.14),0 2px 4px rgba(24,24,27,.06)}
.cmenu button{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:6px 8px;border:0;border-radius:6px;background:transparent;color:var(--ch-t1);font:inherit;font-size:13px;line-height:20px;text-align:left;cursor:pointer}
.cmenu button:hover{background:var(--ch-seg)}
.cmenu button small{display:block;color:var(--ch-t3);font-size:12px;line-height:16px}
.cmenu button .ck{margin-left:auto;color:var(--ch-acc)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:flex-start;padding-block:16px;padding-inline:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.stage.actual{overflow:auto;align-items:flex-start;justify-content:flex-start}
.wrap{position:relative;flex-shrink:0;border-radius:14px;box-shadow:var(--ch-shadow)}
.stage.actual .wrap{margin:0 auto}

/* ---------- product frame: the final design tokens (light by design) ---------- */
.app{
  --canvas:#F6F6F8;--surface:#FFFFFF;--subtle:#FBFBFC;--muted:#F4F4F5;--inverse:#18181B;
  --b-subtle:#F4F4F5;--b-default:#E9E9EC;--b-strong:#D4D4D8;--b-card:#EFEFF1;--b-dash:#DCDCE0;
  --t1:#18181B;--t2:#52525B;--t3:#71717A;--t4:#A1A1AA;--icon:#71717A;--icon2:#3F3F46;
  --pop:0 8px 24px -4px rgba(24,24,27,.10),0 2px 4px rgba(24,24,27,.06);
  --cta:#5B4FE0;--ctaH:#4A3FC9;--ctaS:#F3F2FE;--ctaB:#D9D6FA;--ctaT:#4B40CF;
  --link:#18181B;--link2:#52525B;
  --closed:#334155;--commit:#64748B;--best:#CBD5E1;--track:#EEF0F3;
  --h-good:#64748B;--h-warn:#64748B;
  --rk:#B42318;--rkS:#FEF3F2;--rkB:#FECDCA;
  --wn:#52525B;--wnS:#F4F4F5;--wnB:#E4E4E7;
  --drv-neg:#64748B;--drv-pos:#64748B;--drv-neg-t:#18181B;--drv-pos-t:#18181B;--note:#71717A;--ok:#52525B;--up-i:#3F3F46;--up-t:#18181B;--proj-low:#18181B;--line-q3:#334155;--line-q3-t:#18181B;
  color-scheme:light;
  position:absolute;left:0;top:0;width:1440px;height:1024px;transform-origin:0 0;overflow:hidden;border-radius:14px;
  font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#18181B;background:var(--canvas);-webkit-font-smoothing:antialiased;font-size:14px;line-height:20px;
}
.app *{box-sizing:border-box}
.app [hidden]{display:none!important}
.app button{font:inherit;color:inherit;margin:0;cursor:pointer}
.app input,.app textarea{font:inherit;color:inherit;margin:0}
.app input::placeholder,.app textarea::placeholder{color:#71717A;opacity:1}
.app a{color:var(--ctaT);text-decoration:none}
.app a:hover{color:var(--cta);text-decoration:underline}
.app .m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.app .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.app .hv:hover{background:#F4F4F5!important}
.app .hv-sec:hover{background:#FAFAFA!important;border-color:#D4D4D8!important}
.app .hv-pri:hover{background:var(--ctaH)!important;border-color:var(--ctaH)!important}
.app .row:hover{background:#FAFAFA!important}
.app .row:hover .acct{color:var(--cta)!important}
.app .nav:hover{background:#F4F4F5!important;color:#18181B!important}
.app .fchip:hover{border-color:#A1A1AA!important;color:#18181B!important}
.app button:focus-visible,.app a:focus-visible,.app input:focus-visible,.app textarea:focus-visible,.app [tabindex]:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.app .pg:hover{background:#F4F4F5!important;color:#18181B!important}

/* prototype-only behaviour on top of the artboards */
.app [data-act]{cursor:pointer}
.app a.row:hover{text-decoration:none}
.app .drow{cursor:pointer}
.app .drow.kf{background:#FAFAFA!important}
.app .drow.kf .acct{color:var(--cta)!important}
.app .drow.kf{box-shadow:inset 2px 0 0 var(--cta)}
.app section[data-tile]{transition:border-color .12s}
.app section[data-tile]:hover{border-color:var(--b-strong)!important}
.app section[data-tile].on{border-color:var(--ctaB)!important;box-shadow:0 0 0 1px var(--ctaB)}
.app .seg:hover{filter:brightness(.9)}
.app .tbody{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#D4D4D8 transparent}
.app .pscroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#D4D4D8 transparent}
.app .gtoggle:hover span{color:var(--cta)}
.app .gtoggle svg{transition:transform .15s}
.app .gtoggle[aria-expanded="false"] svg{transform:rotate(-90deg)}
.app .pmenu{position:absolute;z-index:70;padding:6px;border:1px solid var(--b-default);border-radius:10px;box-shadow:var(--pop);background:#fff}
.app .pmenu .mi{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;text-align:left}
.app .pmenu .mi:hover,.app .pmenu .mi.kf{background:var(--muted)}
.app .pmenu .mi[disabled]{cursor:default;opacity:.5}
.app .pmenu .mh{padding:6px 8px 4px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.005em;color:var(--t3)}
.app .pmenu .msep{height:1px;background:var(--b-subtle);margin:6px -6px}
.app .pmenu .mfoot{padding:6px 8px 2px;font-size:12px;line-height:16px;color:var(--t3)}
.app .tip{position:absolute;z-index:200;display:flex;flex-direction:column;gap:2px;padding:7px 10px;border-radius:6px;background:var(--inverse);color:#fff;white-space:nowrap;box-shadow:var(--pop);pointer-events:none}
.app .tip .a{font-size:13px;line-height:20px;font-weight:500}
.app .tip .b{font-size:12px;line-height:16px;font-weight:400;color:#D4D4D8}
.app .tip.one{padding:6px 8px}
.app .tip.one .a{font-family:'Geist',sans-serif;font-size:12px;line-height:16px}
.app .tip i{position:absolute;bottom:-4px;width:8px;height:8px;background:var(--inverse);transform:rotate(45deg)}
.app .tip.below i{bottom:auto;top:-4px}
.app .toast{position:absolute;left:50%;bottom:28px;z-index:300;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:10px;background:var(--inverse);color:#fff;font-size:13px;line-height:20px;box-shadow:0 12px 32px -8px rgba(24,24,27,.35);white-space:nowrap}
.app .toast button{border:0;background:transparent;padding:0 2px;color:#C9C4FF;font-weight:500;font-size:13px}
.app .toast button:hover{color:#fff}
.app .scrim{position:absolute;inset:0;z-index:65}
.app .dim{position:absolute;inset:0;z-index:90;background:rgba(24,24,27,.24)}
.app textarea.fix{width:100%;min-height:64px;resize:none;padding:8px 10px;border:1px solid var(--cta);border-radius:8px;box-shadow:0 0 0 3px var(--ctaS);font-size:13px;line-height:20px;outline:none;background:#fff}
.app input.fix{height:24px;width:120px;padding:0 6px;border:1px solid var(--cta);border-radius:6px;box-shadow:0 0 0 3px var(--ctaS);outline:none;background:#fff;font-size:13px}

/* hotspots */
.app.flash [data-act]{outline:2px solid rgba(91,79,224,.55)!important;outline-offset:-2px;transition:outline-color .5s}
.app.hot [data-act]{outline:1.5px dashed rgba(91,79,224,.6)!important;outline-offset:-1.5px}
.app .pulse{animation:pulse 1.6s ease-out infinite;border-radius:6px}
.app .pulse-row{animation:pulseRow 1.6s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,79,224,.5)}70%{box-shadow:0 0 0 8px rgba(91,79,224,0)}100%{box-shadow:0 0 0 0 rgba(91,79,224,0)}}
@keyframes pulseRow{0%,100%{background:#fff}50%{background:var(--ctaS)}}

/* motion */
.app .panel-in{animation:panelIn .22s cubic-bezier(.2,.8,.2,1)}
.app .menu-in{animation:menuIn .12s ease-out}
.app .fade-in{animation:fadeIn .16s ease-out}
.app .spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
.app .skel [style*="background:var(--muted)"]{animation:skel 1.2s ease-in-out infinite}
@keyframes panelIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes skel{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){
  .app *,.app{animation:none!important;transition:none!important}
}
.guide .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small-note{display:none;position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;font-size:13px;line-height:20px;color:var(--ch-t2);text-align:center}
@media (max-width:1100px){ .guide-wrap .glabel{display:none} }
@media (max-width:720px){
  .bar .brand span{display:none}
  .guide-wrap{display:none}
  .small-note{display:block}
}
</style>

    ['Engagement', () => `Last reply from the buyer took ${4 + ri(4)} days.`, 'crm'],

  return `<span style="display:inline-flex;align-items:center;gap:8px"><span class="m" style="font-size:13px;line-height:20px;font-weight:${risk ? 500 : 400};color:${risk ? 'var(--rk)' : 'var(--t1)'};width:20px;text-align:right">${h}</span><span style="position:relative;display:block;width:${w}px;height:4px;border-radius:2px;background:var(--track)"><span style="position:absolute;left:0;top:0;height:4px;width:${Math.round(h * w / 100)}px;border-radius:2px;background:${risk ? 'var(--rk)' : 'var(--h-good)'}"></span></span>${risk && withLabel ? '<span style="font-size:12px;line-height:16px;font-weight:500;color:var(--rk)">At risk</span>' : ''}</span>`;
}

function sidebarPriya() {
  const views = [['open', VIEWS.open.name], ['closing', VIEWS.closing.name], ['attention', VIEWS.attention.name], ['won', VIEWS.won.name]]
    .concat(S.saved.filter(v => v.pin).map(v => [v.id, v.name]));
  const count = id => { const v = viewDef(id); const b = VIEWS[id] ? VIEWS[id].base : savedBase(v); let l = Object.values(DEALS).filter(b); if (!VIEWS[id]) { l = applyFilters(l, v.set); if (v.set.newOnly) l = l.filter(d => d.isNew); } return l.length; };
  const onPipe = S.screen === 'pipeline';
  const items = views.map(([id, name]) => {
    const cur = onPipe && S.view === id;
    return `<a ${cur ? 'aria-current="page"' : 'class="nav"'} data-act="goto-view" data-view="${id}" href="#" style="display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 36px;border-radius:8px;font-size:14px;line-height:20px;text-decoration:none;color:${cur ? 'var(--ctaT)' : 'var(--t2)'};font-weight:${cur ? 500 : 400}"><span class="ell" style="flex:1">${esc(name)}</span><span class="m" style="font-size:12px;line-height:16px;font-weight:400;color:var(--t3)">${count(id)}</span></a>`;
  }).join('');
  let top = PARTS.p_sb_top;
  const newN = Object.values(DEALS).filter(d => d.owner === 'priya' && d.open && d.isNew).length;
  top = top.replace('aria-label="4 updates" class="m" style="font-size:12px;line-height:16px;font-weight:500;color:var(--cta)">4<', `aria-label="${newN} updates" class="m" style="font-size:12px;line-height:16px;font-weight:500;color:var(--cta)">${newN}<`);
  return `<aside aria-label="Sidebar" style="${PARTS.p_aside_style}">${top}<div style="display:flex;flex-direction:column;gap:2px;margin-top:28px"><div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 4px 0 10px"><span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.005em;color:var(--t3);margin:0;">Saved views</span><span style="flex:1"></span>${iconBtn('plus', 'New saved view', 'save-open')}</div>${items}</div>${PARTS.p_sb_bottom}</aside>`;
}

/* =====================================================================
   Screen 1 · My Pipeline
===================================================================== */
function pipelineScreen() {
  return sidebarPriya() + `<main style="${PARTS.p_main_style}"><div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">${PARTS.p_header}${PARTS.p_kpis}</div>${dealsSection()}</main>`;
}

function toolbar(list, all) {
  const v = viewDef(S.view);
  const edited = isEdited();
  const baseAll = baseList();
  const newN = baseAll.filter(d => d.isNew).length;
  let h = `<div id="tbar" style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px 0 12px;border-bottom:1px solid var(--b-subtle)">`;
  h += `<button aria-haspopup="true" class="hv" data-act="menu" data-menu="views" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:8px;border:0;background:transparent;flex-shrink:0" type="button"><span style="font-size:14px;line-height:20px;font-weight:500;font-weight:600;color:var(--t1)">${esc(v.name)}</span>${edited ? '<span style="display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--muted);font-size:12px;line-height:16px;color:var(--t2)">Edited</span>' : ''}${svg('chevDown', 16)}</button>`;
  if (newN > 0 || S.set.newOnly) {
    h += `<button aria-pressed="${S.set.newOnly}" data-act="new-toggle" style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 ${S.set.newOnly ? 5 : 9}px 0 8px;border-radius:12px;background:var(--ctaS);border:1px solid ${S.set.newOnly ? 'var(--cta)' : 'var(--ctaB)'};color:var(--ctaT);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;flex-shrink:0" title="${S.set.newOnly ? 'Showing only deals updated since 9:00 AM' : 'Show only deals updated since 9:00 AM'}" type="button"><span aria-hidden="true" style="width:6px;height:6px;border-radius:3px;background:var(--cta);flex-shrink:0"></span>${newN} new${S.set.newOnly ? svg('x', 12, 'var(--cta)') : ''}</button>`;
  }
  h += divider;
  const applied = Object.keys(FILTERS).filter(k => S.set.filters[k] != null);
  if (!applied.length) {
    ['stage', 'health', 'flag'].forEach(k => {
      h += `<button class="fchip" data-act="menu" data-menu="f-${k}" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:16px;border:1px dashed var(--b-dash);background:transparent;color:var(--t2);font-size:13px;line-height:20px;flex-shrink:0" type="button">${svg('plusCircle', 14)}${FILTERS[k].label}</button>`;
    });
  } else {
    applied.forEach(k => {
      h += `<span style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 4px;border-radius:16px;border:1px solid var(--b-default);background:var(--surface);flex-shrink:0"><button aria-label="Remove ${FILTERS[k].label} filter" data-act="f-clear" data-f="${k}" class="hv" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;border-radius:12px;background:transparent;padding:0" type="button">${svg('x', 14)}</button><span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">${FILTERS[k].label}</span><span aria-hidden="true" style="width:1px;height:14px;background:var(--b-default)"></span><button data-act="menu" data-menu="f-${k}" style="display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:0 4px 0 0;height:24px;font-size:13px;line-height:20px;font-weight:500;color:var(--ctaT)" type="button">${esc(fLabel(k, S.set.filters[k]))}${svg('chevDown', 14)}</button></span>`;
    });
  }
  h += iconBtn('plus', 'Add a filter', 'menu', 'data-menu="add-filter"');
  h += '<span style="flex:1"></span>';
  if (edited) {
    h += `<button aria-label="Reset view" title="Reset to the saved view" class="hv" data-act="reset" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:8px;background:transparent;border:1px solid transparent;flex-shrink:0" type="button">${svg('undo', 16)}</button>`;
    if (S.compact) h += `<button aria-label="Save view" id="save-btn" class="hv-sec" data-act="save-open" data-tip="Save view|Keeps these filters, grouping and sort" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);flex-shrink:0" type="button">${svg('bookmarkPlus', 16, 'var(--icon2)')}</button>`;
    else { h += btn('Save view', { icon: 'bookmarkPlus', act: 'save-open', id: 'save-btn' }); h += divider; }
  }
  h += `<button aria-expanded="${S.menu && S.menu.kind === 'group'}" aria-haspopup="true" class="hv-sec" data-act="menu" data-menu="group" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0" type="button">${svg('group', 16, 'var(--icon2)')}${S.compact > 1 ? '' : '<span style="color:var(--t3);font-weight:400">Group</span>'}<span style="color:var(--t1)">${GROUPS[S.set.group].label}</span>${svg('chevDown', 16)}</button>`;
  h += `<button aria-expanded="${S.menu && S.menu.kind === 'sort'}" aria-haspopup="true" class="hv-sec" data-act="menu" data-menu="sort" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0" type="button">${svg('sort', 16, 'var(--icon2)')}${S.compact > 1 ? '' : '<span style="color:var(--t3);font-weight:400">Sort</span>'}<span style="color:var(--t1)">${SORTS[S.set.sort].short}</span>${svg('chevDown', 16)}</button>`;
  h += `<button aria-label="Choose columns" class="hv-sec" data-act="noop" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);flex-shrink:0;" type="button">${svg('columns', 16, 'var(--icon2)')}</button>`;
  return h + '</div>';
}

function bulkBar() {
  const ids = [...S.sel]; const sum = ids.reduce((s, id) => s + (DEALS[id].amt || 0), 0);
  return `<div aria-label="Bulk actions" role="toolbar" style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--ctaS);border-bottom:1px solid var(--ctaB)"><span style="font-size:14px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${ids.length} selected</span><span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t4);margin:0;">·</span><span class="m" style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">${money(sum)}</span>${divider}`
    + btn('Move stage', { icon: 'stage', act: 'menu', attrs: 'data-menu="bulk-stage"' })
    + btn('Change close date', { icon: 'calendar', act: 'menu', attrs: 'data-menu="bulk-close"' })
    + btn('Set forecast', { icon: 'bars', act: 'menu', attrs: 'data-menu="bulk-fc"' })
    + btn('Log activity', { icon: 'activity', act: 'noop' })
    + `<span style="flex:1"></span>` + btn('Clear', { icon: 'x', act: 'sel-clear', kind: 'ghost' }) + kbd('Esc') + '</div>';
}

function tableHead(pageRows) {
  const n = pageRows.filter(d => S.sel.has(d.id)).length;
  const st = n === 0 ? 'off' : n === pageRows.length ? 'on' : 'mixed';
  const hd = (t, right) => `<div style="${right ? CELLR : CELL}"><span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.005em;color:var(--t3);margin:0;">${t}</span></div>`;
  return `<div style="display:grid;grid-template-columns:${COLS};align-items:center;height:40px;padding:0 16px;background:var(--subtle);border-bottom:1px solid var(--b-subtle);flex-shrink:0"><div style="${CELL}">${checkbox(st, 'Select all deals on this page', 'data-act="sel-page"')}</div>${hd('Account')}${hd('Deal')}${hd('Amount', 1)}${hd('Close')}${hd('Health')}${hd('Last activity')}${hd('Flags')}<div></div></div>`;
}

function groupRow(key, label, sub, all, pageIds) {
  const members = all.filter(d => GROUPS[S.set.group].key(d) === key);
  const sum = members.reduce((s, d) => s + (d.amt || 0), 0);
  const risk = members.filter(d => d.health != null && d.health < 50).length;
  const selN = members.filter(d => S.sel.has(d.id)).length;
  const st = selN === 0 ? 'off' : selN === members.length ? 'on' : 'mixed';
  const open = !S.collapsed[key];
  return `<div style="display:grid;grid-template-columns:${COLS};align-items:center;height:44px;padding:0 16px;background:var(--subtle);border-bottom:1px solid var(--b-subtle)"><div style="${CELL}">${checkbox(st, 'Select all ' + label + ' deals', `data-act="sel-group" data-g="${esc(key)}"`)}</div><div style="grid-column:span 2;display:flex;align-items:center;min-width:0"><button aria-expanded="${open}" class="gtoggle" data-act="gtoggle" data-g="${esc(key)}" style="display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;height:28px" type="button">${svg('chevDown', 16, 'var(--icon2)')}<span style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${esc(label)}</span><span class="m" style="font-size:12px;line-height:16px;font-weight:400;color:var(--t3);margin:0;">${members.length}</span>${sub ? `<span style="font-size:12px;line-height:16px;color:var(--t3)">${sub}</span>` : ''}</button></div><div style="${CELLR}"><span class="m" style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${sum ? money(sum) : '–'}</span></div><div></div><div style="${CELL}">${risk ? `<span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.005em;color:var(--rk);margin:0;">${risk} at risk</span>` : ''}</div><div></div><div></div><div></div></div>`;
}

function dealRow(d) {
  const isOpen = S.open && S.open.id === d.id;
  const sel = S.sel.has(d.id);
  const kf = S.kf === d.id && !isOpen;
  const bg = isOpen || sel ? 'background:var(--ctaS);' : '';
  const flagCell = d.flag ? flagChip(d.flag) : (d.id === 'cobalt' ? chip('New', 'n') : d.won ? chip('Won', 'n') : '');
  return `<div class="${isOpen ? '' : 'row'} drow${kf ? ' kf' : ''}" data-act="open" data-id="${d.id}" ${isOpen ? 'aria-current="true"' : ''} style="display:grid;grid-template-columns:${COLS};align-items:center;height:48px;padding:0 16px;border-bottom:1px solid var(--b-subtle);${bg}">`
    + `<div style="${CELL}">${checkbox(sel ? 'on' : 'off', 'Select ' + d.acct, `data-act="sel" data-id="${d.id}"`)}</div>`
    + `<div style="${CELL}">${d.isNew && d.open ? dot('Updated since 9:00 AM', 'margin-left:-12px;margin-right:6px') : ''}<a class="ell acct" href="#" data-act="open" data-id="${d.id}" style="font-size:14px;line-height:20px;font-weight:500;color:var(--link)">${esc(d.acct)}</a></div>`
    + `<div style="${CELL}"><span class="ell" style="font-size:14px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">${esc(d.deal)}</span></div>`
    + `<div style="${CELLR}">${d.amt ? `<span class="m" style="font-size:13px;line-height:20px;font-weight:400;color:var(--t1);margin:0;">${money(d.amt)}</span>` : '<span class="m" style="font-size:13px;line-height:20px;color:var(--t3)">–</span>'}</div>`
    + `<div style="${CELL}"><span style="font-size:13px;line-height:20px;font-weight:400;color:${d.close ? 'var(--t1)' : 'var(--t3)'};margin:0;">${d.close || '–'}</span></div>`
    + `<div style="${CELL}">${d.won ? '<span class="m" style="font-size:13px;line-height:20px;color:var(--t3);width:20px;text-align:right">–</span>' : healthMeter(d.health)}</div>`
    + `<div style="${CELL}"><span class="ell" style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">${esc(d.last)}</span></div>`
    + `<div style="${CELL}">${flagCell}</div>`
    + `<div style="display:flex;justify-content:flex-end">${iconBtn('more', 'More actions for ' + d.acct, 'noop', '', 'var(--icon)')}</div></div>`;
}

function pageSlice(all) {
  const pages = Math.max(1, Math.ceil(all.length / S.perPage));
  if (S.page > pages) S.page = pages;
  const start = (S.page - 1) * S.perPage;
  return { pages, start, rows: all.slice(start, start + S.perPage) };
}

function dealsSection() {
  const baseAll = baseList();
  const all = sorted(currentList());
  const { pages, start, rows } = pageSlice(all);
  let body = '';
  if (!all.length) body = filteredEmpty(baseAll);
  else if (S.set.group === 'none') body = rows.map(dealRow).join('');
  else {
    const g = GROUPS[S.set.group];
    let lastKey = null;
    rows.forEach(d => {
      const k = g.key(d);
      if (k !== lastKey) { body += groupRow(k, g.name(k), g.sub ? g.sub(k) : '', all, rows); lastKey = k; }
      if (!S.collapsed[k]) body += dealRow(d);
    });
  }
  const sum = all.reduce((s, d) => s + (d.amt || 0), 0);
  let foot;
  if (!all.length) {
    foot = `<div style="height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;border-top:1px solid var(--b-subtle);margin-top:auto"><span class="m" style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">0</span><span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">of ${baseAll.length} deals match</span><span style="flex:1"></span><span style="display:inline-flex;align-items:center;gap:14px"><span style="display:inline-flex;align-items:center;gap:6px">${kbd('⌫')}<span style="${T12}color:var(--t3);margin:0;">Remove last filter</span></span><button data-act="shortcuts" style="display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:transparent" type="button">${kbd('?')}<span style="${T12}color:var(--t3);margin:0;">All shortcuts</span></button></span></div>`;
  } else {
    const pgBtn = (label, act, attrs, cur, disabled, inner) => disabled
      ? `<button aria-label="${label}" disabled style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:0;background:transparent;font-size:13px;line-height:20px;color:var(--t4);cursor:not-allowed" type="button">${inner}</button>`
      : cur ? `<button aria-current="page" aria-label="${label}" style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:0;background:transparent;font-size:13px;line-height:20px;background:var(--ctaS);box-shadow:inset 0 0 0 1px var(--ctaB);color:var(--ctaT);font-weight:600" type="button">${inner}</button>`
        : `<button aria-label="${label}" class="pg" data-act="${act}" ${attrs} style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:0;background:transparent;font-size:13px;line-height:20px;color:var(--t2)" type="button">${inner}</button>`;
    let nav = pgBtn('Previous page', 'page', `data-p="${S.page - 1}"`, false, S.page <= 1, svg('chevLeft', 16, S.page <= 1 ? 'var(--t4)' : 'var(--icon2)'));
    for (let p = 1; p <= pages; p++) nav += pgBtn('Page ' + p, 'page', `data-p="${p}"`, p === S.page, false, p);
    nav += pgBtn('Next page', 'page', `data-p="${S.page + 1}"`, false, S.page >= pages, svg('chevRight', 16, S.page >= pages ? 'var(--t4)' : 'var(--icon2)'));
    const range = `${start + 1}–${start + rows.length}`;
    foot = `<div style="height:52px;flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--b-subtle);margin-top:auto"><span style="display:inline-flex;align-items:center;gap:8px"><span class="m" style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${range}</span><span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">of ${all.length} deal${all.length === 1 ? '' : 's'}</span><span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t4);margin:0;">·</span><span class="m" style="font-size:13px;line-height:20px;font-weight:400;color:var(--t1);margin:0;">${money(sum)}</span><button aria-haspopup="listbox" aria-label="Rows per page, ${S.perPage}" class="hv-sec" data-act="menu" data-menu="perpage" style="display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 10px;border-radius:8px;border:1px solid var(--b-default);background:var(--surface);font-size:13px;line-height:20px;font-weight:400;color:var(--t1)" type="button"><span class="m">${S.perPage}</span><span style="color:var(--t3)">per page</span>${svg('chevDown', 14)}</button></span><nav aria-label="Pagination" style="display:flex;align-items:center;gap:2px">${nav}</nav><span style="display:inline-flex;align-items:center;gap:14px;justify-self:end"><span style="display:inline-flex;align-items:center;gap:6px">${kbd('↑')}${kbd('↓')}<span style="${T12}color:var(--t3);margin:0;">Move</span></span><span style="display:inline-flex;align-items:center;gap:6px">${kbd('↵')}<span style="${T12}color:var(--t3);margin:0;">Open</span></span><span style="display:inline-flex;align-items:center;gap:6px">${kbd('X')}<span style="${T12}color:var(--t3);margin:0;">Select</span></span><button class="hv" data-act="shortcuts" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px;margin-right:-6px;border:0;border-radius:6px;background:transparent" type="button">${kbd('?')}<span style="${T12}color:var(--t2);margin:0;">All shortcuts</span></button></span></div>`;
  }
  return `<section aria-label="Deals" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--b-card);border-radius:12px;">${S.sel.size ? bulkBar() : toolbar(all, baseAll)}${tableHead(rows)}<div class="tbody" id="tbody" style="flex:1;min-height:0;${!all.length ? 'display:flex;flex-direction:column' : ''}">${body}</div>${foot}</section>`;
}

function filteredEmpty(baseAll) {
  const applied = Object.keys(FILTERS).filter(k => S.set.filters[k] != null);
  const q = S.q.trim();
  const phrase = (k, v, n) => {
    const s = n === 1;
    if (k === 'stage') return `${n} deal${s ? ' is' : 's are'} in ${v}`;
    if (k === 'flag') return v === 'none' ? `${n} deal${s ? ' has' : 's have'} no flag` : `${n} deal${s ? ' is' : 's are'} ${fLabel(k, v)}`;
    if (k === 'health') return `${n} deal${s ? ' has' : 's have'} health ${fLabel(k, v).toLowerCase()}`;
    return `${n} deal${s ? ' is' : 's are'} in ${v}`;
  };
  let title, text; const buttons = [];
  if (q) {
    title = `No deals match “${esc(q)}”`;
    text = `Search looks at account and deal names in ${esc(viewDef(S.view).name)}. Check the spelling, or search everything with ⌘K.`;
    buttons.push(`<button class="hv-sec" data-act="q-clear" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);color:var(--t1);font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0;" type="button">${svg('x', 16, 'var(--icon2)')}<span>Clear search</span></button>`);
  } else {
    const counts = applied.map(k => [k, S.set.filters[k], applyFilters(baseAll, { filters: { [k]: S.set.filters[k] } }).length]);
    title = applied.length > 1 ? `No deals match ${applied.length === 2 ? 'both' : 'all'} filters` : applied.length ? 'No deals match this filter' : 'Nothing updated since 9:00 AM';
    if (applied.length > 1) text = counts.map(c => phrase(c[0], c[1], c[2])).join(' and ') + `, but none ${applied.length === 2 ? 'is both' : 'matches all of them'}. Your pipeline is not empty, these filters just do not overlap.`;
    else if (applied.length) text = `${viewDef(S.view).name} has ${baseAll.length} deals, and none of them match. Your pipeline is not empty.`;
    else text = 'No deal in this view changed since your 9:00 AM baseline.';
    applied.slice().reverse().forEach(k => {
      const rest = Object.assign({}, S.set.filters); delete rest[k];
      const n = applyFilters(baseAll, { filters: rest }).length;
      buttons.push(`<button class="hv-sec" data-act="f-clear" data-f="${k}" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);color:var(--t1);font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0;" type="button">${svg('x', 16, 'var(--icon2)')}<span style="">Remove ${FILTERS[k].label}: ${esc(fLabel(k, S.set.filters[k]))}</span><span class="m" style="font-size:12px;line-height:16px;font-weight:400;color:var(--t3)">shows ${n}</span></button>`);
    });
    if (S.set.newOnly) buttons.push(`<button class="hv-sec" data-act="new-toggle" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);color:var(--t1);font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0;" type="button">${svg('x', 16, 'var(--icon2)')}<span>Show all deals, not just new</span></button>`);
    if (applied.length) buttons.push(`<button class="hv" data-act="f-clear-all" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--t2);font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0;" type="button"><span style="">Clear all filters</span><span class="m" style="font-size:12px;line-height:16px;font-weight:400;color:var(--t3)">shows ${baseAll.length}</span></button>`);
  }
  return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px;text-align:center"><span style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--muted)">${svg('searchX', 20, 'var(--icon2)')}</span><h2 style="font-size:16px;line-height:24px;font-weight:600;letter-spacing:-0.005em;margin:4px 0 0;color:var(--t1)">${title}</h2><p style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2);margin:0;max-width:440px">${text}</p><div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center">${buttons.join('')}</div></div>`;
}

/* =====================================================================
   Screen 2 · Deal preview
===================================================================== */
function panelHTML() {
  const d = DEALS[S.open.id]; const ctx = S.open.ctx; const x = detail(d);
  const idx = ctx.list.indexOf(d.id); const n = ctx.list.length;
  const owner = OWNER(d.owner);
  const nav = (dir, icon, disabled) => `<button aria-label="${dir === 'prev' ? 'Previous' : 'Next'} deal" class="hv" data-act="${dir}" ${disabled ? 'disabled aria-disabled="true"' : ''} style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border-radius:8px;background:transparent;border:1px solid transparent;flex-shrink:0;${disabled ? 'cursor:not-allowed;' : ''}" type="button">${svg(icon, 16, disabled ? 'var(--t4)' : 'var(--icon)')}</button>`;
  let h = `<section aria-label="Deal preview, ${esc(d.acct)}" aria-modal="false" role="dialog" id="panel" class="${S.anim.panel ? 'panel-in' : ''}" style="position:absolute;top:12px;right:12px;bottom:12px;width:720px;z-index:50;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--b-card);border-radius:12px;box-shadow:0 24px 48px -12px rgba(24,24,27,.18),0 4px 12px rgba(24,24,27,.06)">`;
  h += `<div style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 12px 0 16px;border-bottom:1px solid var(--b-subtle)">${nav('prev', 'chevUp', idx <= 0)}${nav('next', 'chevDown', idx >= n - 1)}<span style="font-size:12px;line-height:16px;font-weight:400;color:var(--t3);margin:0;margin-left:6px">${idx + 1} of ${n} in ${esc(ctx.label)}</span><span style="flex:1"></span>${btn('Open in CRM', { icon: 'external', act: 'noop', kind: 'ghost' })}${iconBtn('more', 'More actions', 'noop')}<span aria-hidden="true" style="width:1px;height:20px;background:var(--b-default);margin:0 4px"></span><button aria-label="Close preview" class="hv" data-act="close" style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;border:0;background:transparent;padding:0" type="button">${svg('x', 16)}</button></div>`;
  h += `<div style="position:relative;flex:1;min-height:0;overflow:hidden"><div class="pscroll" id="pbody" style="height:100%"><div style="padding:24px 24px 48px;display:flex;flex-direction:column;gap:24px">`;
  // header
  const titleChip = d.flag ? flagChip(d.flag) : x.isNew ? chip('New', 'n') : d.won ? chip('Won', 'n') : '';
  const field = (label, inner, last) => `<div style="padding:10px 12px;min-width:0;${last ? '' : 'border-right:1px solid var(--b-subtle);'}"><dt style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.005em;color:var(--t3);margin:0 0 4px">${label}</dt><dd style="margin:0">${inner}</dd></div>`;
  const drop = (val, menu, muted) => `<button class="hv" data-act="menu" data-menu="${menu}" style="display:inline-flex;align-items:center;gap:4px;height:24px;margin-left:-6px;padding:0 4px 0 6px;border:0;border-radius:6px;background:transparent;font-size:13px;line-height:20px;font-weight:${muted ? 400 : 500};color:${muted ? 'var(--t3)' : 'var(--t1)'}" type="button">${esc(val)}${svg('chevDown', 14)}</button>`;
  const amt = S.edit && S.edit.kind === 'amt' ? `<input class="fix m" id="amt-input" inputmode="numeric" aria-label="Amount" value="${d.amt || ''}"/>`
    : `<button class="hv" data-act="edit-amt" style="display:inline-flex;align-items:center;gap:6px;height:24px;margin-left:-6px;padding:0 6px;border:0;border-radius:6px;background:transparent" type="button">${d.amt ? `<span class="m" style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1)">${money(d.amt)}</span>` : '<span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t3)">Not set</span>'}${svg('pencil', 12, 'var(--t4)')}</button>`;
  const closeFull = d.close ? d.close + ' 2026' : 'Not set';
  h += `<div style="display:flex;flex-direction:column;gap:12px"><div><div style="display:flex;align-items:center;gap:10px"><h2 style="font-size:20px;line-height:28px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--t1)">${esc(d.acct)}</h2>${titleChip}</div><p style="font-size:14px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">${esc(x.sub)}</p></div>`;
  h += `<dl style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0;border:1px solid var(--b-card);border-radius:10px">`
    + field('Amount', amt)
    + field('Stage', d.won ? `<span style="font-size:13px;line-height:20px;font-weight:500">Closed won</span>` : drop(d.stage, 'd-stage'))
    + field('Close date', (d.won ? `<span style="font-size:13px;line-height:20px;font-weight:500">${closeFull}</span>` : drop(closeFull, 'd-close', !d.close)) + (x.closeNote ? `<div style="font-size:12px;line-height:16px;font-weight:400;color:var(--note);margin:0;margin-top:2px">${x.closeNote}</div>` : ''))
    + field('Forecast', d.won ? '<span style="font-size:13px;line-height:20px;font-weight:500">Closed</span>' : drop(d.fc, 'd-fc'))
    + field('Owner', `<span style="display:inline-flex;align-items:center;gap:6px;height:24px">${avatar(owner.ini, 20)}<span style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${owner.name}</span></span>`, true)
    + '</dl>';
  if (x.suggest) h += suggestionHTML(d, x);
  h += '</div>';
  h += healthHTML(d, x) + nextHTML(d, x) + callHTML(d, x) + peopleHTML(d, x) + activityHTML(d, x);
  h += '</div></div><div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff);pointer-events:none"></div></div>';
  h += `<div style="height:44px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--b-subtle);background:var(--subtle)"><span style="display:inline-flex;align-items:center;gap:6px">${kbd('↑')}${kbd('↓')}<span style="${T12}color:var(--t3);margin:0;">Previous or next deal</span></span><span style="display:inline-flex;align-items:center;gap:6px">${kbd('E')}<span style="${T12}color:var(--t3);margin:0;">Edit a field</span></span><span style="flex:1"></span><span style="display:inline-flex;align-items:center;gap:6px">${kbd('Esc')}<span style="${T12}color:var(--t3);margin:0;">Back to ${S.screen === 'forecast' ? 'forecast' : 'pipeline'}</span></span></div>`;
  return h + '</section>';
}

function doneLine(icon, text, meta, undoAct) {
  return `<div class="fade-in" style="display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;background:var(--subtle);border:1px solid var(--b-subtle);border-radius:10px">${svg(icon, 14, 'var(--ok)')}<span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t1)">${text}</span>${meta ? `<span style="${T12}color:var(--t3)">${meta}</span>` : ''}<span style="flex:1"></span><button data-act="${undoAct}" style="border:0;background:transparent;padding:0;font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.005em;color:var(--ctaT)" type="button">Undo</button></div>`;
}
function suggestionHTML(d, x) {
  const s = x.suggest;
  if (s.state === 'accepted') return doneLine('check', `Close date moved to ${s.to}.`, 'Still inside Q3 · by you, just now', 'sg-undo');
  if (s.state === 'dismissed') return doneLine('x', 'Suggestion dismissed.', 'LoremIQ will not suggest this date again', 'sg-undo');
  return `<div aria-label="Suggested change" role="group" style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px dashed var(--b-strong);border-radius:10px;background:var(--surface)"><span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px;background:var(--ctaS);border:1px solid var(--ctaB);flex-shrink:0">${svg('sparkle', 12, 'var(--cta)')}</span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><div style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1)">${esc(s.title)}</div><div style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2)">${esc(s.body)}</div><div style="display:flex;align-items:center;gap:8px;margin-top:6px">${inferred()}<span style="font-size:12px;line-height:16px;color:var(--t3)">${esc(s.meta)}</span></div></div><div style="display:flex;gap:8px;flex-shrink:0;padding-top:2px"><button class="hv-sec" data-act="sg-accept" style="display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:6px;background:var(--surface);border:1px solid var(--b-default);font-size:13px;line-height:20px;font-weight:500;color:var(--t1);white-space:nowrap" type="button">Move to ${esc(s.to)}</button><button class="hv-sec" data-act="sg-dismiss" style="display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:6px;background:var(--surface);border:1px solid var(--b-default);font-size:13px;line-height:20px;font-weight:500;color:var(--t1);white-space:nowrap" type="button">Not right</button></div></div>`;
}

function trendOf(d, x) {
  if (x.trend) return [x.trend, x.trendDir === 'down' ? 'trendDown' : 'trendUp'];
  const lw = x.lastWeek == null ? d.health : x.lastWeek;
  const diff = d.health - lw;
  if (diff === 0) return ['No change since last week', 'flat'];
  return [(diff < 0 ? 'Down ' : 'Up ') + Math.abs(diff) + ' since last week', diff < 0 ? 'trendDown' : 'trendUp'];
}
const statusChip = (h, extra = '') => h < 50 ? chip('At risk', 'rk', extra) : chip(h < 65 ? 'Watch' : 'On track', 'n', extra);

function healthHTML(d, x) {
  const h3 = '<h3 id="hs" style="font-size:14px;line-height:20px;font-weight:500;margin:0;color:var(--t1)">Deal health</h3>';
  const toggle = open => `<button aria-controls="hs-body" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} deal health" class="hv" data-act="hs-toggle" style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;margin:-4px -6px -4px 0;border-radius:8px;background:transparent;border:1px solid transparent;flex-shrink:0" type="button">${svg(open ? 'chevUp' : 'chevDown', 16)}</button>`;
  if (d.won) {
    return `<section aria-labelledby="hs" style="border:1px solid var(--b-card);border-radius:12px;padding:16px"><div style="display:flex;align-items:center;gap:10px">${h3}<span style="flex:1"></span><span style="${T12}color:var(--t3);margin:0;">Closed ${d.close}</span></div><div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><span style="font-size:32px;line-height:36px;font-weight:600;letter-spacing:-0.02em;color:var(--t4);margin:0;">–</span><span style="font-size:14px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">Scoring stopped at close</span></div><p style="${T12}color:var(--t3);margin:4px 0 0">Health measures open deals. Once a deal closes, onboarding and adoption health take over in the account view.</p></section>`;
  }
  if (x.thin) {
    const items = x.checklist.map(([t, ok]) => ok
      ? `<li style="display:flex;align-items:center;gap:10px;list-style:none;height:28px"><span style="display:flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--cta)">${svg('check', 10, '#fff', 3)}</span><span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t1);margin:0;">${t}</span></li>`
      : `<li style="display:flex;align-items:center;gap:10px;list-style:none;height:28px"><span style="width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--b-strong);flex-shrink:0"></span><span style="font-size:13px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">${t}</span></li>`).join('');
    return `<section aria-labelledby="hs" style="border:1px solid var(--b-card);border-radius:12px;padding:16px"><div style="display:flex;align-items:center;gap:10px">${h3}<span style="flex:1"></span><span style="${T12}color:var(--t3);margin:0;">Created 2 days ago</span>${toggle(true)}</div><div id="hs-body"><div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><span style="font-size:32px;line-height:36px;font-weight:600;letter-spacing:-0.02em;color:var(--t4);margin:0;">–</span><span style="font-size:14px;line-height:20px;font-weight:400;color:var(--t2);margin:0;">Too early to score</span></div><p style="${T12}color:var(--t3);margin:0;margin:4px 0 10px">Scores start after the first recorded meeting, or once a deal is 5 days old. Until then there is too little signal to be fair to it.</p><ul style="margin:0;padding:10px 0 0;border-top:1px solid var(--b-subtle)">${items}</ul></div></section>`;
  }
  const [trend, ticon] = trendOf(d, x);
  const trendEl = `<span style="display:inline-flex;align-items:center;gap:6px">${svg(ticon, 14, 'var(--t3)')}<span style="${T12}color:var(--t3);margin:0;">${trend}</span></span>`;
  if (!x.hsOpen) {
    const anyChg = x.drivers.some(v => v.chg);
    return `<section aria-labelledby="hs" style="border:1px solid var(--b-card);border-radius:12px;padding:14px 16px"><div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;${anyChg ? 'margin-left:-12px' : ''}">${anyChg ? dot('A signal changed today') : ''}${h3}</span><span style="display:inline-flex;align-items:baseline;gap:4px;margin-left:6px"><span class="m" style="font-size:14px;line-height:20px;font-weight:600;color:${d.health < 50 ? 'var(--rk)' : 'var(--t1)'}">${d.health}</span><span style="font-size:12px;line-height:16px;color:var(--t3)">/ 100</span></span>${statusChip(d.health)}<span style="flex:1"></span>${trendEl}${toggle(false)}</div></section>`;
  }
  const rows = x.drivers.map(v => {
    const abs = Math.abs(v.p); const neg = v.p < 0; const w = Math.min(58, abs * 3);
    const name = v.chg ? `<div style="display:flex;align-items:center;gap:6px;margin-left:-12px;font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin-top:0;margin-bottom:0;">${dot('Changed today')}${esc(v.n)}</div>` : `<div style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${esc(v.n)}</div>`;
    const flash = S.flashDriver === v.n ? ' pulse-row' : '';
    return `<div class="${flash}" style="display:grid;grid-template-columns:minmax(0,1fr) 120px 36px 88px;column-gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--b-subtle)"><div style="min-width:0">${name}<div style="font-size:12px;line-height:16px;font-weight:400;color:var(--t2);margin:0;">${esc(v.t)}</div></div><span aria-label="${neg ? '-' : '+'}${abs} points" role="img" style="position:relative;display:block;width:120px;height:8px"><span style="position:absolute;left:59px;top:-2px;width:2px;height:12px;background:var(--b-strong);border-radius:1px"></span><span style="position:absolute;${neg ? 'right:61px' : 'left:61px'};top:0;width:${w}px;height:8px;border-radius:2px;background:var(${neg ? '--drv-neg' : '--drv-pos'})"></span></span><span class="m" style="font-size:13px;line-height:20px;font-weight:500;color:var(${neg ? '--drv-neg-t' : '--drv-pos-t'});margin:0;text-align:right;display:block">${neg ? '−' : '+'}${abs}</span><div style="display:flex;justify-content:flex-end">${v.src === 'ai' ? inferred() : '<span style="font-size:12px;line-height:16px;color:var(--t3);white-space:nowrap;flex-shrink:0">From CRM</span>'}</div></div>`;
  }).join('');
  return `<section aria-labelledby="hs" style="border:1px solid var(--b-card);border-radius:12px;padding:16px 16px 6px"><div style="display:flex;align-items:center;gap:10px">${h3}<span style="flex:1"></span>${trendEl}${toggle(true)}</div><div id="hs-body"><div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><span style="font-size:32px;line-height:36px;font-weight:600;letter-spacing:-0.02em;color:${d.health < 50 ? 'var(--rk)' : 'var(--t1)'};margin:0;">${d.health}</span><span style="font-size:14px;line-height:20px;font-weight:400;color:var(--t3);margin:0;">/ 100</span>${statusChip(d.health, 'align-self:center')}</div><p style="${T12}color:var(--t3);margin:0;margin:4px 0 10px">Starts at ${STAGE_BASE[d.stage]} for a deal in ${d.stage}, then moves with these signals.</p>${rows}</div></section>`;
}

function secHead(title, right = '') {
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><h3 style="font-size:14px;line-height:20px;font-weight:500;margin:0;color:var(--t1)">${title}</h3><span style="flex:1"></span>${right}</div>`;
}

function nextHTML(d, x) {
  const ns = x.next;
  if (S.edit && S.edit.kind === 'ns') {
    return `<section aria-label="Next step">${secHead('Next step')}<div style="display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--b-card);border-radius:10px"><label for="ns-text" style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.005em;color:var(--t2)">What you and the buyer agreed to do next</label><textarea class="fix" id="ns-text" rows="2">${esc(ns && !ns.done ? ns.text : '')}</textarea><div style="display:flex;align-items:center;gap:8px"><span style="${T12}color:var(--t3)">Due</span><span style="font-size:13px;line-height:20px;color:var(--t1)">${esc(ns && !ns.done ? ns.due.replace('Due ', '') : 'Fri 26 Sep')}</span><span style="flex:1"></span>${btn('Cancel', { act: 'ns-cancel', kind: 'ghost' })}${btn('Save', { act: 'ns-save', kind: 'pri' })}</div></div></section>`;
  }
  if (!ns || ns.done) {

===================================================================== */
function forecastScreen() {
  const rows = PARTS.f_rep_rows.map((r, i) => {
    const rid = REP_ORDER[i];
    if (S.rep === rid) return r.replace('class="row"', 'class="" aria-current="true"').replace('color:inherit;"', 'color:inherit;background:var(--ctaS);"');
    return r;
  }).join('');
  return PARTS.f_sb + `<main style="${PARTS.f_main_style}"><div style="${PARTS.f_top_style}">${PARTS.f_header}${PARTS.f_att}</div><div style="${PARTS.f_bottom_style}"><section aria-label="${PARTS.f_reps_label}" style="${PARTS.f_reps_style}">${PARTS.f_reps_toolbar}${PARTS.f_reps_head}<div>${rows}</div>${PARTS.f_reps_total}${PARTS.f_reps_footer}</section>${rightPanel()}</div></main>`;
}

function rightList() {
  if (S.rep) {
    const r = REPS[S.rep]; const ids = r.deals;
    const groups = [['Commit', ids.filter(id => DEALS[id].fc === 'Commit')], ['Best case', ids.filter(id => DEALS[id].fc === 'Best case')]];
    const pipe = ids.filter(id => DEALS[id].fc === 'Pipeline');
    const q4 = pipe.every(id => dayNum(DEALS[id].close) > 30);
    groups.push([q4 ? 'Pipeline, closes in Q4' : 'Pipeline', pipe]);
    return { title: `${r.name}’s deals`, label: `${r.name}’s deals`, groups, collapsedDefault: 2 };
  }
  if (S.seg) {
    const fc = S.seg === 'commit' ? 'Commit' : 'Best case';
    const groups = REP_ORDER.map(rid => [REPS[rid].name, REPS[rid].deals.filter(id => DEALS[id].fc === fc)]).filter(g => g[1].length);
    return { title: fc === 'Commit' ? 'Commit across the team' : 'Best case across the team', label: fc === 'Commit' ? 'Team commit' : 'Team best case', groups };
  }
  return { title: 'Worth a conversation', label: 'Worth a conversation', groups: [['', WORTH]] };
}
function panelContextIds() { const l = rightList(); return l.groups.reduce((a, g, gi) => a.concat(isGroupOpen(gi, l) ? g[1] : []), []); }
function isGroupOpen(gi, l) {
  const key = (S.rep || S.seg || 'w') + ':' + gi;
  if (key in S.repGroups) return S.repGroups[key];
  return l.collapsedDefault !== gi;
}

function rightPanel() {
  if (!S.rep && !S.seg) return PARTS.f_worth;
  const l = rightList();
  const all = l.groups.reduce((a, g) => a.concat(g[1]), []);
  const sum = all.reduce((s, id) => s + DEALS[id].amt, 0);
  let head, note;
  if (S.rep) {
    const r = REPS[S.rep];
    head = `${avatar(r.ini)}<div style="flex:1;min-width:0"><div style="font-size:14px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${r.name}’s deals</div><div style="display:flex;align-items:center;gap:6px"><span style="${T12}color:${r.low ? 'var(--rk)' : 'var(--t3)'};margin:0;">${r.proj}% projected</span><span style="${T12}color:var(--t3);margin:0;">· coverage ${r.cov} · ${all.length} open</span></div></div>`;
    note = r.note;
  } else {
    const fc = S.seg === 'commit' ? 'Commit' : 'Best case';
    const flagged = all.filter(id => DEALS[id].flag);
    const fsum = flagged.reduce((s, id) => s + DEALS[id].amt, 0);
    head = `<span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--muted);border:1px solid var(--b-default);flex-shrink:0">${svg('bars', 14, 'var(--icon2)')}</span><div style="flex:1;min-width:0"><div style="font-size:14px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${l.title}</div><div style="display:flex;align-items:center;gap:6px"><span style="${T12}color:var(--t3);margin:0;">${all.length} deals · ${short(sum)} · ${fc === 'Commit' ? 'lands the team at 68%' : 'takes the team to 87% if all close'}</span></div></div>`;
    note = `${flagged.length} of the ${all.length} ${fc === 'Commit' ? 'commit' : 'best-case'} deals carry a risk flag, ${short(fsum)} between them.`;
  }
  let body = '';
  l.groups.forEach(([gname, ids], gi) => {
    const open = isGroupOpen(gi, l);
    const gsum = ids.reduce((s, id) => s + DEALS[id].amt, 0);
    if (!ids.length && S.rep) return;
    body += `<div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;background:var(--subtle);border-bottom:1px solid var(--b-subtle)"><button aria-expanded="${open}" class="gtoggle" data-act="rgtoggle" data-gi="${gi}" style="display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0" type="button">${svg('chevDown', 16, 'var(--icon2)')}<span style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;">${esc(gname)}</span><span class="m" style="font-size:12px;line-height:16px;font-weight:400;color:var(--t3);margin:0;">${ids.length}</span></button><span style="flex:1"></span><span class="m" style="font-size:12px;line-height:16px;font-weight:500;color:var(--t1);margin:0;">${money(gsum)}</span></div>`;
    if (open) ids.forEach(id => { body += repDealRow(DEALS[id]); });
  });
  return `<section aria-label="${esc(l.title)}" class="${S.anim.right ? 'fade-in' : ''}" style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--b-card);border-radius:12px;"><div style="display:flex;align-items:center;gap:10px;padding:14px 12px 14px 16px;border-bottom:1px solid var(--b-subtle)">${head}${iconBtn('x', S.rep ? 'Clear rep filter' : 'Clear chart filter', 'rep-clear')}</div><div style="height:48px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--b-subtle)"><button aria-haspopup="true" class="hv-sec" data-act="noop" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--b-default);font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0" type="button">${svg('group', 16, 'var(--icon2)')}<span style="color:var(--t3);font-weight:400">Group</span><span style="color:var(--t1)">${S.rep ? 'Forecast category' : 'Rep'}</span>${svg('chevDown', 16)}</button><span style="flex:1"></span><span class="m" style="${T12}color:var(--t3);margin:0;">${short(sum)} ${S.rep ? 'open' : 'in total'}</span></div><div class="pscroll" id="rbody" style="flex:1;min-height:0">${body}</div><div style="padding:14px 16px;border-top:1px solid var(--b-subtle);background:var(--subtle)"><p style="${T12}color:var(--t2);margin:0;">${esc(note)}</p></div></section>`;
}

function repDealRow(d) {
  const open = S.open && S.open.id === d.id;
  const meterW = 32;
  const meter = d.health == null ? '' : `<span style="display:inline-flex;align-items:center;gap:8px"><span class="m" style="font-size:13px;line-height:20px;font-weight:${d.health < 50 ? 500 : 400};color:${d.health < 50 ? 'var(--rk)' : 'var(--t1)'};width:20px;text-align:right">${d.health}</span><span style="position:relative;display:block;width:${meterW}px;height:4px;border-radius:2px;background:var(--track)"><span style="position:absolute;left:0;top:0;height:4px;width:${Math.round(d.health * meterW / 100)}px;border-radius:2px;background:${d.health < 50 ? 'var(--rk)' : 'var(--h-warn)'}"></span></span></span>`;
  const ownerBit = S.seg ? '' : '';
  return `<a class="${open ? '' : 'row'}" href="#" data-act="open" data-id="${d.id}" data-ctx="right" ${open ? 'aria-current="true"' : ''} style="display:flex;flex-direction:column;justify-content:center;gap:4px;height:60px;padding:0 16px;border-bottom:1px solid var(--b-subtle);text-decoration:none;color:inherit;${open ? 'background:var(--ctaS);' : ''}"><span style="display:flex;align-items:center;gap:8px"><span class="ell acct" style="font-size:13px;line-height:20px;font-weight:500;color:var(--t1);margin:0;flex:1">${esc(d.acct)}</span><span class="m" style="font-size:13px;line-height:20px;font-weight:400;color:var(--t1);margin:0;">${money(d.amt)}</span></span><span style="display:flex;align-items:center;gap:8px"><span class="ell" style="${T12}color:var(--t3);margin:0;flex:1">${esc(d.deal)} · closes ${d.close}${ownerBit}</span>${d.flag ? flagChip(d.flag) : ''}${meter}</span></a>`;
}

}
function menuHTML() {

    inner = '<div class="mh">Saved views</div>' + [['open'], ['closing'], ['attention'], ['won']].map(([id]) => mi(VIEWS[id].name, { on: S.view === id, meta: Object.values(DEALS).filter(VIEWS[id].base).length, v: id })).join('')
      + S.saved.map(v => mi(v.name, { on: S.view === v.id, meta: v.share === 'team' ? 'Team' : 'Only me', v: v.id })).join('')
      + '<div class="msep"></div>' + `<button class="mi" data-act="save-open" type="button">${svg('bookmarkPlus', 16)}<span style="font-size:13px;line-height:20px;color:var(--t1)">Save as a new view</span></button>`;
  } else if (m.kind.startsWith('f-')) {
    const k = m.kind.slice(2); const f = FILTERS[k];
    const cur = S.set.filters[k];
    inner = `<div class="mh">${f.label}</div>` + f.opts().map(([v, label]) => {

  const ww = Math.round(1440 * scale), wh = Math.round(1024 * scale);
  wrapEl.style.width = ww + 'px';
  wrapEl.style.height = wh + 'px';
  stageEl.classList.toggle('actual', S.zoom !== 'fit');

  wrapEl.style.marginLeft = S.zoom === 'fit' ? Math.max(0, Math.floor((stageEl.clientWidth - ww) / 2) - 16) + 'px' : '';
